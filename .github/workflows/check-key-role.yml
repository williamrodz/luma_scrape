name: Check Supabase key role (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: Print key role only
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          k = os.environ.get("SUPABASE_KEY", "")
          if k.startswith("sb_"):
              print("key type:", k.split("_")[1])
          else:
              p = k.split(".")[1]; p += "=" * (-len(p) % 4)
              print("key role:", json.loads(base64.urlsafe_b64decode(p)).get("role"))
          PY
