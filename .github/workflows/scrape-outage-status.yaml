name: Scrape Outage Status

on:
  schedule:
    # Every 5 minutes (UTC)
    - cron: '*/5 * * * *'
  workflow_dispatch:  # allows manual triggering from the GitHub UI

jobs:
  scrape:
    runs-on: self-hosted

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # Using 3.12 for better GitHub Actions compatibility

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --no-install-project

      - name: Run scraper
        run: uv run --no-project python scrape_outage_status.py

      - name: Show timestamp
        run: echo "Scraped at $(date -u)"