[project]
name = "luma-scrape"
version = "0.1.0"
description = "Web scraper for LUMA Energy grid status and outages"
readme = "README.md"
requires-python = ">=3.12"
# Direct dependencies only; uv.lock pins everything (including transitive packages).
# Upgrade all with: uv lock --upgrade
dependencies = [
    "boto3>=1.43.6",           # s3_buffer.py
    "holidays>=0.96",          # align_scrape_results.py
    "playwright>=1.52,<2",     # scrape_luma_grid_status.py
    "python-dotenv>=1.2.2",
    "pytz>=2025.2",            # scrape_luma_grid_status.py
    "requests>=2.33.0",        # scrape_outage_status.py
    "selenium>=4.31,<5",       # scrape_notable_outages.py
    "supabase>=2.15,<3",       # also provides postgrest
    "webdriver-manager>=4.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

# No build-system needed - this is a script-based project, not a package
# We use `uv sync --no-install-project` to only install dependencies
