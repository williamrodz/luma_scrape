name: Scrape LUMA Grid Status Data

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:       # Allow manual trigger

jobs:
  run-scraper:
    runs-on: self-hosted

    steps:
      - name: Update code
        run: git -C $GITHUB_WORKSPACE fetch origin main && git -C $GITHUB_WORKSPACE reset --hard origin/main

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --no-install-project

      - name: Install Playwright browsers
        run: uv run playwright install chromium
      - name: Debug Environment
        run: |
          echo "Checking environment variables (values hidden)"
          env | grep SUPABASE || echo "No SUPABASE variables found"

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUFFER_BUCKET: ${{ secrets.AWS_S3_BUFFER_BUCKET }}
        run: |
          uv run --no-project python scrape_luma_grid_status.py

      - name: Align scrape results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          uv run --no-project python align_scrape_results.py