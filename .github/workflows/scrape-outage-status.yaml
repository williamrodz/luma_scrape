name: Scrape Outage Status

on:
  schedule:
    # Every 5 minutes (UTC)
    - cron: '*/5 * * * *'
  workflow_dispatch:  # allows manual triggering from the GitHub UI

jobs:
  scrape:
    runs-on: self-hosted

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUFFER_BUCKET: ${{ secrets.AWS_S3_BUFFER_BUCKET }}
    steps:
      - name: Update code
        run: git -C $GITHUB_WORKSPACE fetch origin main && git -C $GITHUB_WORKSPACE reset --hard origin/main

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --no-install-project

      - name: Run scraper
        run: uv run --no-project python scrape_outage_status.py

      - name: Show timestamp
        run: echo "Scraped at $(date -u)"