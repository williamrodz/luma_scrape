name: Scrape LUMA Grid Status Data

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:       # Allow manual trigger

jobs:
  run-scraper:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # Using 3.12 for better GitHub Actions compatibility

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --no-install-project

      - name: Install Playwright browsers
        run: uv run playwright install chromium
      - name: Debug Environment
        run: |
          echo "Checking environment variables (values hidden)"
          env | grep SUPABASE || echo "No SUPABASE variables found"

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUFFER_BUCKET: ${{ secrets.AWS_S3_BUFFER_BUCKET }}
        run: |
          uv run --no-project python scrape_luma_grid_status.py

      - name: Align scrape results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          uv run --no-project python align_scrape_results.py